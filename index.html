<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>僵尸防线 · 至尊版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#120f1e; display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  #wrap { position:relative; }
  canvas { display:block; background:#1b1630; border-radius:12px; touch-action:none; cursor:crosshair; }
  .tag { position:absolute; top:-24px; left:0; color:#7a7799; font-size:12px; letter-spacing:1px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="tag">至尊版 · 局外养成 + 抽宝石 + 模拟充值 · 数据自动存档</div>
  <canvas id="cv" width="480" height="800"></canvas>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const WALL_Y = H - 110, PLAYER_Y = H - 70;
// 像素士兵立绘（生成素材）
const soldierImg = new Image(); soldierImg.src = 'soldier.png';
const ZSPRITES = {};
for(const [k,f] of Object.entries({normal:'z_normal.png',fast:'z_fast.png',tank:'z_tank.png',bomber:'z_bomber.png',nurse:'z_nurse.png',boss:'z_boss.png'})){
  const im = new Image(); im.src = f; ZSPRITES[k] = im;
}

// ================= 存档（局外累积） =================
const SAVE_KEY = 'zf_save_v1';
const SAVE_DEFAULT = () => ({ coins:0, dia:0, gems:[], up:{atk:0,rate:0,hp:0,coin:0}, paid:{}, vipPts:0,
  bag:[], equip:{weapon:null,armor:null,helmet:null}, unlocked:[] });
function loadSave(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && s.up){
      const d = SAVE_DEFAULT();
      return { ...d, ...s, up:{...d.up, ...s.up},
        equip:{ weapon:s.equip?.weapon||null, armor:s.equip?.armor||null, helmet:s.equip?.helmet||null },
        bag: Array.isArray(s.bag)? s.bag : [], unlocked: Array.isArray(s.unlocked)? s.unlocked : [] };
    }
  } catch(e){}
  return SAVE_DEFAULT();
}
let save = loadSave();
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const VIP_LV = ()=> Math.floor(save.vipPts/60);
const VIP_COIN_BONUS = ()=> VIP_LV()*0.08;

// 宝石定义：q=品质 1传说 2绝世 3至尊
const GEM_TYPES = [
  { id:'critR', name:'致命宝石', base:0.02, unit:'%暴击',   fmt:v=>`+${Math.round(v*100)}% 暴击率` },
  { id:'critD', name:'狂暴宝石', base:0.10, unit:'%暴伤',   fmt:v=>`+${Math.round(v*100)}% 暴击伤害` },
  { id:'atk',   name:'力量宝石', base:0.04, unit:'%攻击',   fmt:v=>`+${Math.round(v*100)}% 攻击力` },
  { id:'rate',  name:'迅捷宝石', base:0.03, unit:'%射速',   fmt:v=>`+${Math.round(v*100)}% 射速` },
  { id:'coin',  name:'贪财宝石', base:0.05, unit:'%金币',   fmt:v=>`+${Math.round(v*100)}% 金币收益` },
  { id:'exe',   name:'处决宝石', base:0.01, unit:'%秒杀',   fmt:v=>`+${(v*100).toFixed(1)}% 处决概率` },
];
const GEM_QUALITY = [ {n:'传说',c:'#8ea2ff',m:1}, {n:'绝世',c:'#ffb347',m:2}, {n:'至尊',c:'#ff5ce1',m:3.5} ];

function gemBonus(id){
  return save.gems.filter(g=>g.id===id).reduce((s,g)=> s + GEM_TYPES.find(t=>t.id===g.id).base * GEM_QUALITY[g.q].m, 0);
}
function gemPower(){ return save.gems.reduce((s,g)=>s+g.q,0); }

// ================= 全局状态 =================
let state = 'menu';   // menu | play | levelup | over
let speed = 1;
let frame = 0;
let player, wall, bullets, zombies, parts, drones, bolts, bossShots, floatTexts;
let wave, spawnQueue, kills, runCoins, runDia, xp, level, xpNeed, stats, runSkills, shake;
let effects, coinsFly;   // 冲击波特效 / 飞向钱包的金币
let pendingLevels;       // 待结算的升级数（波次打完才弹三选一）
let bagDrops, newEquips; // 本局掉落数 / 掉落清单
let waveBanner = null;   // 波次大字横幅
let flashMuzzle = 0, barrageTimer = 0, chainTimer = 0;

// 局外加成
function metaBonus(){
  const eq = equipStats();
  return {
    atk:  1 + save.up.atk*0.10 + gemBonus('atk') + eq.atk/100,
    rate: 1 + save.up.rate*0.06 + gemBonus('rate') + eq.rate/100,
    hp:   1 + save.up.hp*0.10 + eq.hp/100,
    coin: save.up.coin*0.08 + VIP_COIN_BONUS() + gemBonus('coin'),
    crit: eq.crit/100,
    exe:  gemBonus('exe'),
  };
}

function baseStats(){
  const m = metaBonus();
  return { dmg:10*m.atk, rate:2.4*m.rate, multi:1, pierce:0, boom:0, ice:0, drone:0,
           crit:Math.min(0.95, gemBonus('critR') + m.crit), critD:2.5+gemBonus('critD'),
           laser:0, burn:0, chain:0, barrage:0, exe:0,
           wall:100*m.hp, exeGem:m.exe };
}

function reset(){
  stats = baseStats();          // 每局重建属性（清掉上一局技能，重算局外加成）
  waveTimer = 90;
  player = { x:W/2, targetX:W/2, cd:0, ang:0, recoil:0 };
  wall = { hp:stats.wall, max:stats.wall };
  bullets=[]; zombies=[]; parts=[]; drones=[]; bolts=[]; bossShots=[]; floatTexts=[];
  effects=[]; coinsFly=[]; pendingLevels=0; bagDrops=0; newEquips=[]; waveBanner=null;
  wave=0; spawnQueue=[]; kills=0; runCoins=0; runDia=0;
  xp=0; level=1; xpNeed=12; runSkills={}; shake=0; barrageTimer=480; chainTimer=240;
  flashMuzzle=0;
}

// ================= 技能池 =================
const MAX_DISTINCT = 4;   // 一局最多学 4 个不同技能（之后只能升级已学的）
const SKILL_POOL = [
  { id:'dmg',    icon:'💥', name:'火力强化', desc:'子弹伤害 +35%',              max:8 },
  { id:'rate',   icon:'⚡', name:'极速扳机', desc:'射击速度 +25%',              max:8 },
  { id:'multi',  icon:'🔱', name:'多弹道',   desc:'同时多发射一发子弹',          max:4 },
  { id:'pierce', icon:'🏹', name:'穿甲弹头', desc:'子弹可穿透 +1 个目标',        max:4 },
  { id:'boom',   icon:'🧨', name:'爆破弹头', desc:'命中后小范围爆炸',            max:5 },
  { id:'ice',    icon:'❄️', name:'低温弹',   desc:'命中减速 40%，持续 2 秒',     max:3 },
  { id:'drone',  icon:'🛸', name:'无人战机', desc:'召唤一台自动副炮',            max:4, locked:true, cost:300 },
  { id:'crit',   icon:'🎯', name:'致命瞄准', desc:'暴击率 +12%',                max:6 },
  { id:'wall',   icon:'🛡️', name:'防线加固', desc:'防线回 30% 并提升上限 15%',   max:5 },
  { id:'laser',  icon:'🔆', name:'制导激光', desc:'持续照射最近敌人的高能光束',   max:5, locked:true, cost:300 },
  { id:'burn',   icon:'🔥', name:'燃烧弹',   desc:'命中点燃，持续灼烧伤害',      max:4, locked:true, cost:250 },
  { id:'chain',  icon:'🌩️', name:'雷电链',   desc:'闪电在敌人之间跳跃',          max:4, locked:true, cost:350 },
  { id:'barrage',icon:'✨', name:'弹幕风暴', desc:'周期性向全屏发射弹幕',        max:3, locked:true, cost:400 },
  { id:'exe',    icon:'☠️', name:'处决令',   desc:'击中时有概率直接秒杀小怪',    max:4, locked:true, cost:500 },
];
const ICON_OF = id => (SKILL_POOL.find(s=>s.id===id)||{}).icon || '❔';

// ================= 装备系统 =================
const EQUIP_SLOTS = { weapon:{name:'枪械',icon:'🔫',stat:'atk'}, armor:{name:'护甲',icon:'🦺',stat:'hp'}, helmet:{name:'头盔',icon:'⛑️'} };
const STAT_LABEL = { atk:'攻击', hp:'防线', rate:'射速', crit:'暴击' };
const EQ_QUALITY = [
  {n:'普通', c:'#9ad34f'}, {n:'稀有', c:'#57b2ff'}, {n:'史诗', c:'#c07cff'}, {n:'传说', c:'#ffb347'}
];
const EQ_RANGE = { atk:[4,30], hp:[5,32], rate:[3,18], crit:[2,10] };
function rollEquip(isBoss){
  const slots = ['weapon','armor','helmet'];
  const slot = isBoss? slots[Math.floor(Math.random()*3)] : (Math.random()<0.5? 'weapon' : (Math.random()<0.5? 'armor':'helmet'));
  const r = Math.random();
  const q = isBoss? (r<0.15?3:(r<0.5?2:1)) : (r<0.04?3:(r<0.2?2:1));
  let statId = EQUIP_SLOTS[slot].stat;
  if(slot==='helmet') statId = Math.random()<0.5? 'rate':'crit';
  const [lo,hi] = EQ_RANGE[statId];
  const qBoost = [1,1.15,1.3,1.5][q];
  const roll = Math.round((lo + Math.random()*(hi-lo)) * qBoost * 10)/10;
  return { id: Date.now()+Math.floor(Math.random()*9999), slot, q, lv:1, statId, roll: Math.min(roll, hi*1.2) };
}
function equipStatValue(it){
  if(!it) return 0;
  return Math.round(it.roll * (1 + (it.lv-1)*0.08) * 10)/10;
}
function equipStats(){
  const s = {atk:0,hp:0,rate:0,crit:0};
  for(const k of ['weapon','armor','helmet']){
    const it = save.equip[k];
    if(it) s[it.statId] += equipStatValue(it);
  }
  return s;
}
const eqUpCost = it => Math.round(120 * Math.pow(1.35, it.lv-1));

function offerSkills(){
  // 一波一选：全部可选技能随机 4 张（已学的会显示"强化 Lv.x→x+1"），无槽位限制、无保底干预
  let pool = SKILL_POOL.filter(s => (!s.locked || save.unlocked.includes(s.id)) && (runSkills[s.id]||0) < s.max);
  const picks = [];
  while(picks.length<4 && pool.length){
    const i = Math.floor(Math.random()*pool.length);
    picks.push(pool.splice(i,1)[0]);
  }
  if(picks.length===0){
    runCoins += 100;
    floatText(player.x, PLAYER_Y-90, '技能全满级 · +100金币', '#ffd93d');
    return;
  }
  state='levelup'; levelupOptions = picks;
}
let levelupOptions = [];

function applySkill(s){
  runSkills[s.id]=(runSkills[s.id]||0)+1;
  ring(player.x, PLAYER_Y-30, 90, '#b98cff', 4, 20);
  floatText(player.x, PLAYER_Y-90, s.name+' Lv.'+runSkills[s.id], '#b98cff');
  switch(s.id){
    case 'dmg': stats.dmg*=1.35; break;
    case 'rate': stats.rate*=1.25; break;
    case 'multi': stats.multi+=1; break;
    case 'pierce': stats.pierce+=1; break;
    case 'boom': stats.boom+=1; break;
    case 'ice': stats.ice+=1; break;
    case 'drone': stats.drone+=1; drones.push({x:player.x,y:PLAYER_Y,cd:0}); break;
    case 'crit': stats.crit=Math.min(0.95, stats.crit+0.12); break;
    case 'wall': wall.max=Math.round(wall.max*1.15); wall.hp=Math.min(wall.max, wall.hp+wall.max*0.3); break;
    case 'laser': stats.laser+=1; break;
    case 'burn': stats.burn+=1; break;
    case 'chain': stats.chain+=1; break;
    case 'barrage': stats.barrage+=1; break;
    case 'exe': stats.exe+=1; break;
  }
  state='play';
}

// ================= 波次 =================
function buildWave(n){
  waveBanner = { text: n%5===0? `⚠ 第 ${n} 波 · BOSS 来袭` : `第 ${n} 波`, boss: n%5===0, life:80, max:80 };
  spawnQueue = [];
  const boss = n % 5 === 0;
  let count = 10 + Math.floor(n*2.2);          // 小兵更多，场面热闹
  if(boss) count = Math.floor(count*0.6);
  for(let i=0;i<count;i++){
    let type = 'normal';
    const r = Math.random();
    if(n>=2 && r<0.25) type='fast';
    else if(n>=4 && r<0.40) type='tank';
    else if(n>=6 && r<0.50) type='bomber';     // 自爆胖子
    else if(n>=8 && r<0.58) type='nurse';      // 奶妈僵尸
    spawnQueue.push({ type, delay: 70 + i*(boss?34:16) });   // 出怪更密
  }
  if(boss) spawnQueue.push({ type:'boss', delay: 70 + count*16 + 40 });
}

const ZTYPES = {
  normal:{ hp:24,  hpw:7,   spd:0.35, spw:0.012, w:44, h:64, dmg:8,  coin:2,  dia:0, xp:2 },
  fast:  { hp:14,  hpw:5,   spd:0.85, spw:0.018, w:34, h:56, dmg:5,  coin:3,  dia:0, xp:3 },
  tank:  { hp:90,  hpw:18,  spd:0.22, spw:0.008, w:58, h:74, dmg:16, coin:6,  dia:0, xp:5 },
  bomber:{ hp:30,  hpw:9,   spd:0.5,  spw:0.012, w:46, h:72, dmg:0,  coin:5,  dia:0, xp:4 },
  nurse: { hp:40,  hpw:11,  spd:0.3,  spw:0.010, w:42, h:64, dmg:4,  coin:6,  dia:0, xp:4 },
  boss:  { hp:500, hpw:95,  spd:0.16, spw:0,     w:98, h:110,dmg:30, coin:50, dia:20, xp:30 },
};
function spawn(type){
  const b = ZTYPES[type];
  zombies.push({ type, x: 50+Math.random()*(W-100), y: -b.h, hurt:0,
    hp:b.hp+wave*b.hpw, max:b.hp+wave*b.hpw, spd:b.spd+wave*b.spw,
    w:b.w, h:b.h, dmg:b.dmg, coin:b.coin, dia:b.dia, xpv:b.xp, slow:0, atkCd:0, burn:0, shotCd:240 });
}

// ================= 输入 =================
let speedBtn = { x:W-52, y:52, r:22 };
let pauseBtn = { x:W-112, y:52, r:20 };
function pt(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}
cv.addEventListener('pointerdown', e=>{
  const p = pt(e);
  const dx=p.x-speedBtn.x, dy=p.y-speedBtn.y;
  if(state==='play' && dx*dx+dy*dy < speedBtn.r*speedBtn.r){
    speed = speed===1?2:(speed===2?3:1); return;
  }
  const px=p.x-pauseBtn.x, py=p.y-pauseBtn.y;
  if(state==='play' && px*px+py*py < pauseBtn.r*pauseBtn.r){
    state='pause'; return;
  }
  player.targetX = p.x;
});
cv.addEventListener('pointermove', e=>{
  if(e.buttons){ const p = pt(e); player.targetX = p.x; }
});

// ================= 射击 =================
function fireBullet(x,y,t,dmgMul,isDrone){
  const crit = Math.random()<stats.crit;
  bullets.push({ x,y, vx:0, vy:isDrone?-13:-16,
    dmg:stats.dmg*dmgMul*(crit?stats.critD:1), crit, pierce:isDrone?0:stats.pierce,
    hitSet:new Set(), drone:!!isDrone, target:t, spd:isDrone?13:16 });
}
function shoot(){
  const t = zombies.filter(z=>z.y>-z.h).sort((a,b)=>b.y-a.y)[0];
  if(!t) return;
  // 枪口尖端出膛（贴立绘枪口位置）
  const tipX = player.x + 22, tipY = PLAYER_Y - 82;
  for(let i=0;i<stats.multi;i++){
    const off = (i-(stats.multi-1)/2);
    fireBullet(tipX + Math.cos(player.ang)*off*8, tipY + Math.sin(player.ang)*off*8, t, 1, false);
  }
  flashMuzzle = 4;
  player.recoil = 7;
  player.cd = 60/stats.rate;
}

// ================= 特效 =================
function burst(x,y,color,n=8){
  for(let i=0;i<n;i++) parts.push({ x,y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5,
    life:20+Math.random()*15, color });
}
function boomArea(x,y,r,dmg){
  burst(x,y,'#ff8c42',14); burst(x,y,'#ff7b3a',6);
  shake = Math.max(shake,2.5);
  effects.push({x,y,r:8,maxR:r,life:13,maxLife:13,color:'#ff8c42',lw:5});
  zombies.forEach(z=>{ const dx=z.x-x, dy=(z.y+z.h/2)-y;
    if(dx*dx+dy*dy < r*r){ z.hp-=dmg; z.hurt=8; } });
}
function ring(x,y,maxR,color,lw=3,life=18){
  effects.push({x,y,r:6,maxR,life,maxLife:life,color,lw});
}
function floatText(x,y,txt,color){ floatTexts.push({x,y,txt,color,life:40}); }

// ================= 主循环（单步） =================
function update(){
  frame++;
  player.x += (player.targetX-player.x)*0.25;
  player.x = Math.max(24, Math.min(W-24, player.x));
  // 炮管转向：追踪离防线最近的怪（限制不朝后打）
  {
    const tgt = zombies.filter(z=>z.hp>0 && z.y>-z.h).sort((a,b)=>b.y-a.y)[0];
    let desired = 0;
    if(tgt){
      const dx = tgt.x - player.x, dy = (tgt.y+tgt.h/2) - (PLAYER_Y-10);
      desired = Math.max(-1.15, Math.min(1.15, Math.atan2(dx, -dy)));
    }
    player.ang += (desired - player.ang)*0.22;
  }
  if(player.recoil>0) player.recoil*=0.8;
  if(--player.cd<=0) shoot();
  if(flashMuzzle>0) flashMuzzle--;

  drones.forEach((d,i)=>{
    d.x += ((player.x + Math.sin(frame*0.05+i*2)*70) - d.x)*0.1;
    d.y = PLAYER_Y - 60 + Math.cos(frame*0.06+i)*10;
    if(--d.cd<=0){
      const t = zombies.filter(z=>z.y>-z.h).sort((a,b)=>b.y-a.y)[0];
      if(t){ fireBullet(d.x,d.y,t,0.5,true); d.cd=45; }
    }
  });

  // 波次推进（唯一入口）：场清 + 计时到 → 开下一波；第 2 波起，开波前弹上一波的四选一
  if(waveTimer>0) waveTimer--;
  if(waveTimer<=0 && spawnQueue.length===0 && zombies.length===0){
    wave++;
    buildWave(wave);
    if(wave>1) offerSkills();   // 选卡期间 state=levelup，update 暂停，选完怪才进场
  }
  // 怪物生成（delay 里含波间喘息）
  spawnQueue.forEach(s=>s.delay--);
  spawnQueue.filter(s=>s.delay<=0).forEach(s=>spawn(s.type));
  spawnQueue = spawnQueue.filter(s=>s.delay>0);

  // 弹幕风暴
  if(stats.barrage>0 && --barrageTimer<=0){
    barrageTimer = 480 - stats.barrage*60;
    for(let i=0;i<14;i++){
      const a = Math.PI + (i/13)*Math.PI;
      bullets.push({ x:player.x, y:PLAYER_Y-24, vx:Math.cos(a)*9, vy:Math.sin(a)*9,
        dmg:stats.dmg*0.6, crit:false, pierce:1, hitSet:new Set(), drone:false });
    }
    floatText(player.x, PLAYER_Y-60, '弹幕风暴!', '#8be9fd');
  }
  // 雷电链
  if(stats.chain>0 && --chainTimer<=0){
    chainTimer = 300 - stats.chain*25;
    const alive = zombies.filter(z=>z.hp>0 && z.y>-z.h);
    if(alive.length){
      let cur = alive[Math.floor(Math.random()*alive.length)];
      const chainSet = [cur]; const pts=[{x:cur.x,y:cur.y+cur.h/2}];
      for(let j=0;j<2+stats.chain;j++){
        const next = alive.filter(z=>!chainSet.includes(z))
          .sort((a,b)=>Math.hypot(a.x-cur.x,a.y-cur.y)-Math.hypot(b.x-cur.x,b.y-cur.y))[0];
        if(!next) break;
        chainSet.push(next); pts.push({x:next.x,y:next.y+next.h/2}); cur=next;
      }
      chainSet.forEach(z=>{ z.hp-=stats.dmg*1.2; z.hurt=8; });
      bolts.push({pts, life:14});
    }
  }

  // 子弹（锁定追踪：飞行中持续转向目标，指哪打哪）
  bullets.forEach(b=>{
    if(b.target && b.target.hp>0 && !b.target.deadTag){
      const tx=b.target.x, ty=b.target.y+b.target.h/2;
      const dx=tx-b.x, dy=ty-b.y, d=Math.hypot(dx,dy)||1;
      b.vx=dx/d*b.spd; b.vy=dy/d*b.spd;
    }
    b.x+=b.vx; b.y+=b.vy;
    zombies.forEach(z=>{
      if(b.hitSet.has(z) || z.hp<=0) return;
      if(b.x>z.x-z.w/2-4 && b.x<z.x+z.w/2+4 && b.y>z.y && b.y<z.y+z.h){
        b.hitSet.add(z);
        z.hp-=b.dmg; z.hurt=8;
        burst(b.x,b.y, b.crit?'#ffd93d':'#ff6b6b', b.crit?6:3);
        if(b.crit) ring(b.x,b.y,16,'#ffd93d',2,10);
        if(stats.exe && z.type!=='boss' && Math.random() < 0.02*stats.exe + stats.exeGem){
          z.hp=0; floatText(z.x,z.y,'处决!','#ff5ce1');
        }
        if(stats.boom) boomArea(b.x,b.y, 40+stats.boom*10, stats.dmg*0.4*stats.boom);
        if(stats.ice){ z.slow = 120; burst(b.x,b.y,'#bfe9ff',5); }
        if(stats.burn) z.burn = 180;
        if(b.pierce>0) b.pierce--; else b.dead=true;
      }
    });
  });
  bullets = bullets.filter(b=>!b.dead && b.y>-20 && b.x>-20 && b.x<W+20);

  // 制导激光
  if(stats.laser>0){
    const t = zombies.filter(z=>z.hp>0 && z.y>-z.h).sort((a,b)=>b.y-a.y)[0];
    laserTarget = t || null;
    if(t){ t.hp -= 0.3*stats.laser; t.hurt = 4; }
  } else laserTarget = null;

  // 僵尸
  zombies.forEach(z=>{
    if(z.hp<=0) return;
    const spd = z.spd * (z.slow>0?0.6:1);
    if(z.slow>0) z.slow--;
    if(z.hurt>0) z.hurt--;
    if(z.burn>0){ z.burn--; z.hp -= 0.08*stats.burn; if(frame%6===0) parts.push({x:z.x+(Math.random()-0.5)*z.w,y:z.y+z.h*0.5,vx:0,vy:-1.5,life:14,color:'#ff7b3a'}); }
    // 奶妈僵尸：每 2 秒治疗周围同伴
    if(z.type==='nurse'){
      if(frame % 120 === 0){
        let healed=false;
        zombies.forEach(o=>{
          if(o!==z && !o.deadTag && Math.hypot(o.x-z.x,o.y-z.y)<130 && o.hp<o.max){
            o.hp = Math.min(o.max, o.hp + o.max*0.08);
            healed=true;
            floatText(o.x, o.y, '+', '#7dff9e');
          }
        });
        if(healed) ring(z.x, z.y+z.h/2, 130, '#7dff9e', 2, 16);
      }
    }
    // 自爆胖子：贴近防线自爆（大伤害+震动），被远距打死则安全
    if(z.type==='bomber'){
      if(z.y + z.h >= WALL_Y + 26){
        wall.hp -= 26; shake=16;
        boomArea(z.x, WALL_Y+20, 90, 0);
        burst(z.x, WALL_Y, '#ff5252', 22);
        floatText(z.x, WALL_Y-40, '💥 自爆 -26', '#ff5252');
        z.hp = 0; z.deadTag = true;
        return;
      }
    }
    if(z.y + z.h < WALL_Y + 30){ z.y += spd; }
    else {
      if(z.dmg>0 && --z.atkCd<=0){ wall.hp -= z.dmg; z.atkCd=50; burst(z.x, WALL_Y, '#ff5252', 5); shake=Math.max(shake,4); }
    }
    // Boss 远程攻击
    if(z.type==='boss' && z.y>60 && --z.shotCd<=0){
      z.shotCd = 200;
      bossShots.push({ x:z.x, y:z.y+z.h, vx:(player.x-z.x)*0.004, vy:4.5 });
    }
  });
  // Boss 弹
  bossShots.forEach(s=>{ s.x+=s.vx; s.y+=s.vy;
    if(s.y>WALL_Y+20){ wall.hp-=12; burst(s.x,s.y,'#ff5252',8); shake=Math.max(shake,6); s.dead=true; } });
  bossShots = bossShots.filter(s=>!s.dead && s.y<H+20);

  // 死亡结算
  zombies.forEach(z=>{
    if(z.hp<=0 && !z.deadTag){
      z.deadTag=true; kills++;
      runCoins+=z.coin; runDia+=z.dia; xp+=z.xpv;
      burst(z.x,z.y+z.h/2, z.color, z.type==='boss'?30:8);
      // 金币飞进钱包
      const nCoins = z.type==='boss'?12:(z.type==='tank'?5:3);
      for(let i=0;i<nCoins;i++)
        coinsFly.push({x:z.x,y:z.y+z.h/2, vx:(Math.random()-0.5)*7, vy:-Math.random()*5-2});
      // 装备掉落（Boss 必掉）
      const dropCh = z.type==='boss'?1:(z.type==='tank'?0.09:(z.type==='fast'?0.05:0.04));
      if(Math.random()<dropCh && bagDrops<6){
        const it = rollEquip(z.type==='boss');
        if(save.bag.length>=12){ runCoins += 20*(it.q+1); floatText(z.x,z.y,'背包满→金币','#ffd93d'); }
        else { save.bag.push(it); bagDrops++; newEquips.push(it);
          floatText(z.x,z.y, EQ_QUALITY[it.q].n+'·'+EQUIP_SLOTS[it.slot].name, EQ_QUALITY[it.q].c); }
      }
      // 宝石掉落
      if(Math.random() < (z.type==='boss'?0.5:0.03)){
        const t = GEM_TYPES[Math.floor(Math.random()*GEM_TYPES.length)];
        const q = z.type==='boss'? (Math.random()<0.4?2:1) : 0;
        save.gems.push({id:t.id, q});
        floatText(z.x,z.y-16,'💎 '+GEM_QUALITY[q].n+'宝石','#8be9fd');
      }
      if(z.type==='boss'){ ring(z.x,z.y+z.h/2,120,'#ffd93d',6,26); wall.hp=Math.min(wall.max, wall.hp+20); shake=14; floatText(z.x,z.y,'BOSS击破 +20钻','#ffd93d'); }
    }
  });
  zombies = zombies.filter(z=>!z.deadTag);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; });
  parts = parts.filter(p=>p.life>0);
  // 金币追踪飞向 HUD 钱包
  coinsFly.forEach(c=>{
    const tx=190, ty=26;
    c.vx += (tx-c.x)*0.0016; c.vy += (ty-c.y)*0.0016;
    c.vx*=0.93; c.vy*=0.93;
    const sp=Math.hypot(c.vx,c.vy), max=15;
    if(sp>max){ c.vx*=max/sp; c.vy*=max/sp; }
    c.x+=c.vx; c.y+=c.vy;
    if(Math.hypot(tx-c.x,ty-c.y)<22) c.got=true;
  });
  coinsFly = coinsFly.filter(c=>!c.got);
  effects.forEach(e=>{ e.life--; e.r += (e.maxR-e.r)*0.25; });
  effects = effects.filter(e=>e.life>0);
  bolts.forEach(b=>b.life--); bolts = bolts.filter(b=>b.life>0);
  floatTexts.forEach(f=>{f.y-=0.6;f.life--;}); floatTexts = floatTexts.filter(f=>f.life>0);
  if(shake>0) shake-=0.5;

  while(xp>=xpNeed){ xp-=xpNeed; xpNeed=Math.round(xpNeed*1.6); runCoins+=30; floatText(player.x, PLAYER_Y-70, '+30金币(经验)', '#ffd93d'); }
  if(wall.hp<=0){ settleRun(); state='over'; }
}
// 结算带出（防线失守 & 中途退出共用）
function settleRun(){
  const m = metaBonus();
  save.coins += Math.round(runCoins*(1+m.coin));
  save.dia += runDia;
  persist();
}
let waveTimer = 90;
let laserTarget = null;

// ================= 绘制 =================
// 背景（离屏预渲染）
const bg = document.createElement('canvas'); bg.width=W; bg.height=H;
(function(){
  const b = bg.getContext('2d');
  const g = b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141026'); g.addColorStop(0.55,'#1e1836'); g.addColorStop(1,'#2a2148');
  b.fillStyle=g; b.fillRect(0,0,W,H);
  // 月亮
  b.fillStyle='#e8e4ff22'; b.beginPath(); b.arc(W-80,90,46,0,7); b.fill();
  b.fillStyle='#e8e4ff44'; b.beginPath(); b.arc(W-80,90,34,0,7); b.fill();
  // 远处城市剪影
  b.fillStyle='#171226';
  let x=0; let seed=7;
  while(x<W){ seed=(seed*16807)%2147483647; const bw=30+seed%50, bh=40+seed%90;
    b.fillRect(x, WALL_Y-bh, bw, bh);
    b.fillStyle='#1d1730';
    for(let wy=WALL_Y-bh+8; wy<WALL_Y-10; wy+=16)
      for(let wx=x+6; wx<x+bw-8; wx+=12)
        if((wx*wy)%7<2){ b.fillRect(wx,wy,4,6); }
    b.fillStyle='#171226';
    x+=bw+8;
  }
  // 地面
  b.fillStyle='#241d3e'; b.fillRect(0,WALL_Y+30,W,H-WALL_Y-30);
  b.strokeStyle='#2e2650'; b.lineWidth=1;
  for(let y=WALL_Y+44;y<H;y+=18){ b.beginPath(); b.moveTo(0,y); b.lineTo(W,y); b.stroke(); }
})();

function drawZombie(z){
  const spr = ZSPRITES[z.type];
  ctx.save();
  // 脚下阴影
  ctx.globalAlpha=0.35; ctx.fillStyle='#0a0814';
  ctx.beginPath(); ctx.ellipse(z.x, z.y+z.h-2, z.w*0.38, 6, 0, 0, 7); ctx.fill();
  ctx.globalAlpha=1;
  const wob = Math.sin(frame*0.15+z.x)*2;   // 走路晃动
  if(spr && spr.complete && spr.naturalWidth>0){
    ctx.drawImage(spr, z.x - spr.width/2, z.y + wob*0.3, spr.width, spr.height);
    if(z.hurt>0){   // 受击白闪（用半透明白矩形叠加精灵区域）
      ctx.globalCompositeOperation='source-atop';
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillRect(z.x-spr.width/2, z.y, spr.width, spr.height);
      ctx.globalCompositeOperation='source-over';
    }
  } else {
    // 兜底：无图时画色块
    ctx.fillStyle = '#7fae5b';
    ctx.beginPath(); ctx.roundRect(z.x-z.w/2, z.y, z.w, z.h, 6); ctx.fill();
  }
  ctx.restore();
  // 冰冻框 / 血条（画在精灵上层）
  if(z.slow>0){
    ctx.strokeStyle='#7fd6ff'; ctx.lineWidth=2;
    ctx.strokeRect(z.x-z.w/2-2, z.y-2, z.w+4, z.h+4);
  }
  if(z.hp < z.max){
    const bw = z.w;
    ctx.fillStyle='#00000088'; ctx.fillRect(z.x-bw/2,-12+ (z.y>0?0:0),bw,5);
    ctx.fillStyle='#ff5252'; ctx.fillRect(z.x-bw/2,-12,bw*(z.hp/z.max),5);
  }
  // 自爆胖子低血量闪烁警示
  if(z.type==='bomber' && z.hp < z.max*0.4 && frame%14<7){
    ctx.strokeStyle='#ff5252'; ctx.lineWidth=3;
    ctx.strokeRect(z.x-z.w/2-4, z.y-4, z.w+8, z.h+8);
  }
}

function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.drawImage(bg,0,0);

  // 防线（沙袋墙）
  ctx.fillStyle='#4a3f2a'; ctx.fillRect(0,WALL_Y+30,W,16);
  for(let x=0;x<W;x+=34){
    ctx.fillStyle='#5c4e33'; ctx.beginPath(); ctx.roundRect(x+2,WALL_Y+16,30,15,4); ctx.fill();
    ctx.fillStyle='#6b5c3d'; ctx.beginPath(); ctx.roundRect(x+6,WALL_Y+28,26,13,4); ctx.fill();
  }
  ctx.fillStyle='#00000066'; ctx.fillRect(20,WALL_Y+54,W-40,12);
  ctx.fillStyle= wall.hp/wall.max>0.3? '#4ade80':'#ff5252';
  ctx.fillRect(20,WALL_Y+54,(W-40)*Math.max(0,wall.hp/wall.max),12);
  ctx.fillStyle='#cfcfe8'; ctx.font='11px sans-serif';
  ctx.fillText(`防线 ${Math.max(0,Math.ceil(wall.hp))}/${Math.ceil(wall.max)}`, 22, WALL_Y+52);

  // 哨兵（像素士兵立绘，背视角持枪）
  const SW = 92, SH = 92;
  const sy = PLAYER_Y + 8 - SH;
  const bob = Math.sin(frame*0.08)*1.2;
  if(soldierImg.complete && soldierImg.naturalWidth>0){
    // 脚下阴影（融合图层）
    ctx.save();
    ctx.globalAlpha=0.45; ctx.fillStyle='#0a0814';
    ctx.beginPath(); ctx.ellipse(player.x, PLAYER_Y+6, SW*0.32, 7, 0, 0, 7); ctx.fill();
    ctx.restore();
    ctx.drawImage(soldierImg, player.x - SW/2, sy + bob, SW, SH);

    // 枪口火光（贴立绘枪口）
    if(flashMuzzle>0){
      ctx.save();
      ctx.translate(player.x + 22, sy + 34);
      ctx.shadowColor='#ffd93d'; ctx.shadowBlur=12;
      ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill();
      ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
      ctx.restore();
    }
  }

  // 无人机
  drones.forEach(d=>{
    ctx.fillStyle='#8be9fd'; ctx.beginPath(); ctx.arc(d.x,d.y,9,0,7); ctx.fill();
    ctx.fillStyle='#1b1630'; ctx.beginPath(); ctx.arc(d.x,d.y,3.5,0,7); ctx.fill();
    ctx.strokeStyle='#8be9fd66'; ctx.beginPath(); ctx.arc(d.x,d.y,13+Math.sin(frame*0.3)*2,0,7); ctx.stroke();
  });

  // 激光（发光+命中点闪烁）
  if(laserTarget && stats.laser>0){
    ctx.save();
    ctx.shadowColor='#ff5ce1'; ctx.shadowBlur=14;
    ctx.strokeStyle='#ff9df0'; ctx.lineWidth=2+stats.laser;
    ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.moveTo(player.x+22,PLAYER_Y-82); ctx.lineTo(laserTarget.x,laserTarget.y+laserTarget.h/2); ctx.stroke();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(player.x+22,PLAYER_Y-82); ctx.lineTo(laserTarget.x,laserTarget.y+laserTarget.h/2); ctx.stroke();
    ctx.globalAlpha=1;
    const fx=laserTarget.x, fy=laserTarget.y+laserTarget.h/2;
    ctx.fillStyle='#ffceff';
    ctx.beginPath(); ctx.arc(fx,fy,4+Math.random()*4,0,7); ctx.fill();
    ctx.restore();
  }
  // 闪电
  bolts.forEach(bo=>{
    ctx.strokeStyle='#ffe95c'; ctx.lineWidth=2.5; ctx.globalAlpha=bo.life/14;
    ctx.beginPath();
    bo.pts.forEach((p,i)=>{
      if(i===0) ctx.moveTo(p.x,p.y);
      else { const prev=bo.pts[i-1];
        const mx=(prev.x+p.x)/2+(Math.random()-0.5)*18, my=(prev.y+p.y)/2+(Math.random()-0.5)*18;
        ctx.lineTo(mx,my); ctx.lineTo(p.x,p.y); }
    });
    ctx.stroke(); ctx.globalAlpha=1;
  });

  // 怪物 & Boss弹（此前被误删导致怪物隐身，已修复）
  zombies.forEach(drawZombie);
  bossShots.forEach(s=>{ ctx.fillStyle='#ff7b6b'; ctx.beginPath(); ctx.arc(s.x,s.y,6,0,7); ctx.fill(); });
  // 子弹（发光拖尾）
  bullets.forEach(b=>{
    const col = b.crit? '#ffd93d' : (b.drone? '#8be9fd':'#ffb347');
    // 拖尾
    ctx.strokeStyle=col; ctx.globalAlpha=0.45; ctx.lineWidth=b.crit?4:2.5;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*2.4, b.y-b.vy*2.4); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.globalAlpha=1;
    // 本体发光
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur= b.crit?16:9;
    ctx.fillStyle= b.crit? '#fff6c9' : col;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.crit?5.5:3.8,0,7); ctx.fill();
    ctx.restore();
  });
  // 冲击波
  effects.forEach(e=>{
    ctx.globalAlpha=e.life/e.maxLife;
    ctx.strokeStyle=e.color; ctx.lineWidth=e.lw;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  });
  // 飞行金币
  coinsFly.forEach(c=>{
    ctx.save(); ctx.shadowColor='#ffd93d'; ctx.shadowBlur=8;
    ctx.fillStyle='#ffd93d'; ctx.beginPath(); ctx.arc(c.x,c.y,4.2,0,7); ctx.fill();
    ctx.fillStyle='#b8860b'; ctx.beginPath(); ctx.arc(c.x,c.y,4.2,0.6,2.6); ctx.stroke();
    ctx.restore();
  });
  parts.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.life/35); ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4); ctx.globalAlpha=1; });
  floatTexts.forEach(f=>{ ctx.globalAlpha=Math.min(1,f.life/40); ctx.fillStyle=f.color;
    ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); ctx.textAlign='left'; ctx.globalAlpha=1; });

  ctx.restore(); // shake 结束

  // HUD（不参与震动）
  ctx.fillStyle='#cfcfe8'; ctx.font='bold 16px sans-serif';
  ctx.fillText(`第 ${wave} 波`, 20, 30);
  ctx.font='13px sans-serif';
  ctx.fillText(`击杀 ${kills}`, 110, 30);
  ctx.fillText(`💰${runCoins}`, 175, 30);
  ctx.fillText(`💎${runDia}`, 240, 30);
  if(bagDrops>0){ ctx.fillText(`🎁${bagDrops}`, 295, 30); }
  ctx.fillStyle='#00000066'; ctx.fillRect(340,16,80,10);
  ctx.fillStyle='#b98cff'; ctx.fillRect(340,16,80*Math.min(1,xp/xpNeed),10);
  // 倍速按钮
  ctx.fillStyle='#00000088'; ctx.beginPath(); ctx.arc(speedBtn.x,speedBtn.y,speedBtn.r,0,7); ctx.fill();
  ctx.strokeStyle= speed>1?'#ffb347':'#66648a'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle= speed>1?'#ffb347':'#aaa8c8'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
  ctx.fillText('x'+speed, speedBtn.x, speedBtn.y+5); ctx.textAlign='left';
  // 暂停按钮
  ctx.fillStyle='#00000088'; ctx.beginPath(); ctx.arc(pauseBtn.x,pauseBtn.y,pauseBtn.r,0,7); ctx.fill();
  ctx.strokeStyle='#8886a8'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#cfcfe8'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('❚❚', pauseBtn.x, pauseBtn.y+5); ctx.textAlign='left';

  // 右侧已学技能栏（图标+等级）+ 宝石加成可视化
  const ownedSkills = Object.keys(runSkills).filter(k=>runSkills[k]>0);
  const gemLines = GEM_TYPES.map(t=>({t, v:gemBonus(t.id)})).filter(g=>g.v>0.0001);
  const GEM_SHORT = { critR:'暴击', critD:'暴伤', atk:'攻击', rate:'射速', coin:'金币', exe:'处决' };
  const gemIcon = { critR:'🎯', critD:'💢', atk:'💥', rate:'⚡', coin:'💰', exe:'☠️' };
  if(ownedSkills.length || gemLines.length){
    const px = W-38, py = 92;
    const rows = ownedSkills.length + (gemLines.length? gemLines.length+1 : 0);
    const h = rows*22 + 34;
    ctx.fillStyle='#00000073'; ctx.beginPath(); ctx.roundRect(px-46, py-20, 58, h, 9); ctx.fill();
    ctx.strokeStyle='#4a437088'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#9996b5'; ctx.font='10px sans-serif'; ctx.textAlign='center';
    ctx.fillText(`已学 ${ownedSkills.length} 项`, px-17, py-6);
    ctx.textAlign='left';
    let ry = py+12;
    ownedSkills.forEach(id=>{
      const s = SKILL_POOL.find(x=>x.id===id);
      ctx.font='14px sans-serif'; ctx.fillText(s.icon, px-38, ry);
      ctx.fillStyle= runSkills[id]>=s.max? '#ffd93d':'#cfcfe8';
      ctx.font='bold 11px sans-serif';
      ctx.fillText('Lv'+runSkills[id], px-14, ry-1);
      ry += 22;
    });
    if(gemLines.length){
      ctx.fillStyle='#ff5ce1'; ctx.font='10px sans-serif';
      ctx.fillText('◆ 宝石加成', px-38, ry+2); ry += 18;
      gemLines.forEach(g=>{
        ctx.font='11px sans-serif';
        ctx.fillStyle='#e0d8ff';
        ctx.fillText(`${gemIcon[g.t.id]}${GEM_SHORT[g.t.id]} +${Math.round(g.v*100)}%`, px-38, ry);
        ry += 18;
      });
    }
  }
  // 波次横幅（大字居中）
  if(waveBanner && waveBanner.life>0){
    waveBanner.life--;
    const t = waveBanner.life/waveBanner.max;
    const scale = 1 + (1-t)*0.3;
    ctx.save(); ctx.globalAlpha = Math.min(1, t*2.5);
    ctx.translate(W/2, H*0.35); ctx.scale(scale, scale);
    ctx.font='bold 34px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle = waveBanner.boss? '#ff5252' : '#ffd93d';
    ctx.shadowColor = waveBanner.boss? '#ff5252':'#000'; ctx.shadowBlur=12;
    ctx.fillText(waveBanner.text, 0, 0);
    ctx.restore(); ctx.textAlign='left';
  }

  if(spawnQueue.length===0 && zombies.length===0 && state==='play'){
    ctx.fillStyle='#b98cff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('波次间歇 · 下一波来袭', W/2, 120); ctx.textAlign='left';
  }
}

const wrap = document.getElementById('wrap');
function getOL(){
  let ol = document.getElementById('ol');
  if(!ol){
    ol=document.createElement('div'); ol.id='ol';
    Object.assign(ol.style,{position:'absolute',inset:0,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',textAlign:'center',overflowY:'auto',padding:'20px'});
    wrap.appendChild(ol);
  }
  return ol;
}
function overlay(html, sig){
  const ol = getOL();
  if(ol.dataset.sig === sig) return;
  ol.dataset.sig = sig;
  ol.innerHTML = html;
  ol.style.pointerEvents='auto';
  ol.querySelectorAll('.btn').forEach(b=>{
    Object.assign(b.style,{background:'#ffb347',color:'#221c33',fontWeight:'bold',
      padding:'12px 44px',borderRadius:'10px',cursor:'pointer',fontSize:'18px',margin:'6px'});
    b.onclick=()=>{ b.dataset.act==='menu'? backToMenu() : (reset(), state='play', ol.remove()); };

    Object.assign(b.style,{background: b.dataset.can==='1'?'#4ade80':'#4a4370',color: b.dataset.can==='1'?'#10231a':'#9996b5',
      fontWeight:'bold',padding:'9px 16px',borderRadius:'9px',cursor: b.dataset.can==='1'?'pointer':'default',
      fontSize:'14px',whiteSpace:'nowrap'});
    b.onclick=()=>{ if(b.dataset.can==='1') b.dataset.fn(); };

function drawChest(n){
  const cost = n===1?100:300;
  if(save.dia<cost) return;
  save.dia-=cost;
  chestResults=[];
  for(let k=0;k<n;k++){
    const r=Math.random();
    const q = r < (n===3?0.15:0.05)? 2 : (r < (n===3?0.60:0.30)? 1 : 0);
    const t = GEM_TYPES[Math.floor(Math.random()*GEM_TYPES.length)];
    chestResults.push({id:t.id, q});
  }
  save.gems.push(...chestResults);
  persist(); chestView='result'; menuDirty=true;
}

// ================= 场景切换 =================
function drawLevelup(){
  draw();
  const owned = Object.keys(runSkills).filter(k=>runSkills[k]>0).length;
  const cards = levelupOptions.map((s,i)=>{
    const lv = runSkills[s.id]||0;
    const tag = lv>0
      ? `<span style="color:#ffb347;font-size:11px">⬆ Lv.${lv}→${lv+1}</span>`
      : `<span style="color:#4ade80;font-size:11px">新技能</span>`;
    return `
    <div class="card" data-i="${i}">
      <div class="icn">${s.icon}</div>
      <div class="cn">${s.name} ${tag}</div>
      <div class="cd2">${s.desc}</div>
    </div>`;
  }).join('');
  const ol = overlay(`<div style="font-size:22px;font-weight:bold;color:#b98cff;margin-bottom:14px">第 ${wave} 波结束 · 四选一</div>
    <div style="display:flex;gap:10px">${cards}</div>`,
    'lv'+level+'_'+levelupOptions.map(s=>s.id).join(','));
  if(!ol) return;
  ol.querySelectorAll('.card').forEach(c=>{
    Object.assign(c.style,{width:'104px',padding:'12px 8px',background:'#322b4d',
      borderRadius:'12px',cursor:'pointer',border:'2px solid #4a4370'});
    c.onmouseenter=()=>c.style.borderColor='#ffb347';
    c.onmouseleave=()=>c.style.borderColor='#4a4370';
    c.onclick=()=>{ applySkill(levelupOptions[+c.dataset.i]); clearOL(); };
  });
  ol.querySelectorAll('.icn').forEach(e=>Object.assign(e.style,{fontSize:'30px',marginBottom:'6px'}));
  ol.querySelectorAll('.cn').forEach(e=>Object.assign(e.style,{color:'#fff',fontWeight:'bold',marginBottom:'8px',fontSize:'15px'}));
  ol.querySelectorAll('.cd2').forEach(e=>Object.assign(e.style,{color:'#aaa8c8',fontSize:'12px',lineHeight:1.5}));
}
function drawOver(){
  draw();
  const gained = Math.round(runCoins*(1+metaBonus().coin));
  overlay(`
    <div style="font-size:30px;font-weight:bold;color:#ff5252;margin-bottom:8px">防线失守</div>
    <div style="color:#cfcfe8;font-size:15px;line-height:2;margin-bottom:16px">
      坚守 <b style="color:#ffb347">${wave}</b> 波 · 击杀 <b style="color:#ffb347">${kills}</b><br>
      结算带出：<span class="gold">金币 +${gained}</span>（含加成）<span class="dia"> ｜ 钻石 +${runDia}</span>
    </div>
    <div style="display:flex;gap:10px">
      <div class="btn">再来一局</div>
      <div class="btn" id="ovUp" style="background:#4ade80">💰 去强化战力</div>
      <div class="btn" id="ovBag" style="background:#4a4370;color:#fff">🎒 背包(${newEquips.length})</div>
    </div>
    ${newEquips.length? `<div style="margin-top:8px;font-size:12px">${newEquips.map(it=>`<span style="color:${EQ_QUALITY[it.q].c}">${EQUIP_SLOTS[it.slot].icon}${EQ_QUALITY[it.q].n}·${EQUIP_SLOTS[it.slot].name}</span>`).join(' · ')}</div>`:''}
    <div class="note">金币去军备/装备仓库强化 · 钻石去实验室解锁技能、去宝箱抽宝石</div>`, 'over'+wave+'_'+kills+'_'+gained);
  const ou=document.getElementById('ovUp'); if(ou) ou.onclick=()=>{ subView='up'; state='menuSub'; menuDirty=true; clearOL(); };
  const ob=document.getElementById('ovBag'); if(ob) ob.onclick=()=>{ subView='equip'; state='menuSub'; menuDirty=true; clearOL(); };
}
function drawPause(){
  draw();
  const ol = overlay(`
    <div style="font-size:26px;font-weight:bold;color:#cfcfe8;margin-bottom:16px">已暂停</div>
    <div class="btn" id="pResume">继续战斗</div>
    <div class="btn" id="pRestart" style="background:#4a4370;color:#fff;font-size:15px">重新开局</div>
    <div class="btn" id="pExit" style="background:#4a4370;color:#fff;font-size:15px">结算并回基地</div>
    <div class="note">结算 = 本局金币/钻石按加成带出局，不会白打</div>`, 'pause');
  if(!ol) return;
  const r=ol.querySelector('#pResume'); if(r) r.onclick=()=>{ state='play'; clearOL(); };
  const rs=ol.querySelector('#pRestart'); if(rs) rs.onclick=()=>{ reset(); state='play'; clearOL(); };
  const ex=ol.querySelector('#pExit'); if(ex) ex.onclick=()=>{ settleRun(); backToMenu(); };
}

// ================= 主循环 =================
function loop(){
  // 非战斗状态下也让飘字自然消失
  if(state!=='play'){ floatTexts.forEach(f=>f.life--); floatTexts = floatTexts.filter(f=>f.life>0); }
  if(state==='play'){
    clearOL();
    for(let i=0;i<speed;i++) update();
    if(state==='play') draw();
    else if(state==='levelup') drawLevelup();
    else if(state==='over') drawOver();
  }
  else if(state==='menu') drawMenu();
  else if(state==='menuSub') drawMenuSub();
  else if(state==='levelup') drawLevelup();
  else if(state==='over') drawOver();
  else if(state==='pause') drawPause();
  requestAnimationFrame(loop);
}
stats = baseStats();
reset(); state='menu';
requestAnimationFrame(loop);
</script>
